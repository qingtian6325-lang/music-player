<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg-blur"></div>

<header class="topbar">
  <div class="logo" id="logo-home">🎵 音乐播放器</div>
  <div class="search-box">
    <input id="search-input" type="text" placeholder="搜索歌曲 / 歌手 / 专辑…" autocomplete="off">
    <select id="source-select" title="音乐源">
      <option value="netease" selected>网易云</option>
      <option value="joox">JOOX</option>
      <option value="bilibili">B站</option>
    </select>
    <button id="search-btn">搜索</button>
  </div>
  <nav class="topnav">
    <button id="nav-home" class="active">🏠 首页</button>
    <button id="nav-fav">❤️ 收藏</button>
  </nav>
</header>

<main id="main">
  <!-- 首页：榜单 -->
  <section id="view-home">
    <h2 class="section-title">🔥 热门榜单</h2>
    <div id="chart-grid" class="chart-grid"></div>
  </section>

  <!-- 列表：榜单曲目 / 搜索结果 / 收藏 -->
  <section id="view-list" hidden>
    <div class="list-header">
      <button id="back-home" class="ghost-btn">← 返回</button>
      <h2 id="list-title" class="section-title"></h2>
    </div>
    <div id="track-list" class="track-list"></div>
    <div id="list-loading" class="loading" hidden>加载中…</div>
    <div id="list-empty" class="empty" hidden>没有找到相关歌曲，换个关键词试试</div>
  </section>
</main>

<!-- 歌词面板 -->
<div id="lyrics-panel" class="lyrics-panel" hidden>
  <div class="lyrics-head">
    <img id="lyrics-cover" class="lyrics-cover" alt="">
    <div class="lyrics-meta">
      <div id="lyrics-title" class="lyrics-title">—</div>
      <div id="lyrics-artist" class="lyrics-artist">—</div>
    </div>
    <button id="lyrics-close" class="ghost-btn">✕</button>
  </div>
  <div id="lyrics-body" class="lyrics-body">
    <div class="lyrics-empty">暂无歌词</div>
  </div>
</div>

<!-- 底部播放条 -->
<footer id="player-bar">
  <div class="pb-left">
    <img id="pb-cover" class="pb-cover" alt="">
    <div class="pb-meta">
      <div id="pb-title" class="pb-title">还没有播放歌曲</div>
      <div id="pb-artist" class="pb-artist">搜一首歌或点开榜单开始吧</div>
    </div>
    <button id="fav-btn" class="icon-btn" title="收藏">🤍</button>
  </div>
  <div class="pb-center">
    <div class="pb-controls">
      <button id="mode-btn" class="icon-btn" title="播放模式：顺序">🔁</button>
      <button id="prev-btn" class="icon-btn" title="上一首">⏮</button>
      <button id="play-btn" class="icon-btn big" title="播放/暂停">▶</button>
      <button id="next-btn" class="icon-btn" title="下一首">⏭</button>
      <button id="lyrics-btn" class="icon-btn" title="歌词">🎤</button>
    </div>
    <div class="pb-progress">
      <span id="time-cur">0:00</span>
      <div id="progress-wrap" class="progress-wrap"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="time-total">0:00</span>
      <span id="quality-badge" class="quality-badge" hidden></span>
    </div>
  </div>
  <div class="pb-right">
    <span class="vol-icon">🔊</span>
    <input id="vol-slider" type="range" min="0" max="100" value="80">
  </div>
</footer>

<div id="toast" class="toast" hidden></div>
<div id="api-credit">音乐数据接口：GD音乐台 (music.gdstudio.xyz) · CC BY-NC 4.0 · 本站仅供学习交流，请勿商用</div>

<audio id="audio" preload="auto"></audio>
<script src="js/app.js"></script>
</body>
</html>
